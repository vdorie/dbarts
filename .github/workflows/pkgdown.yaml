# Renders the pkgdown site and, on pushes, deploys it to the gh-pages
# branch for GitHub Pages. Workflow derived from
# https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [main, bartcore]
    # the site renders from R/, man/, README, vignettes, and _pkgdown.yml;
    # repo-internal design docs and benchmarks are not inputs (README.md
    # IS an input, so markdown is not blanket-ignored here)
    paths-ignore:
      - 'docs/**'
      - 'TODO'
      - 'benchmarks/**'
  pull_request:
    branches: [main, bartcore]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # apt-get has been observed to stall indefinitely against the Ubuntu
      # archive mirror on hosted runners (both inside setup-r below and
      # inside the system requirements install); bounded retries turn a
      # stall into a fast failure instead of one that burns the whole job
      # timeout.
      - name: Bound apt network stalls
        run: |
          echo 'Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/99-ci-retry
          echo 'Acquire::http::Timeout "15";' | sudo tee -a /etc/apt/apt.conf.d/99-ci-retry
          echo 'Acquire::https::Timeout "15";' | sudo tee -a /etc/apt/apt.conf.d/99-ci-retry

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        timeout-minutes: 12
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        timeout-minutes: 15
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      # dest_dir must be passed explicitly: build_site_github_pages ignores
      # the destination in _pkgdown.yml and would try to clean docs/, which
      # holds the design documents.
      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE, dest_dir = "docs-site")
        shell: Rscript {0}

      - name: Deploy to GitHub pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          clean: false
          branch: gh-pages
          folder: docs-site

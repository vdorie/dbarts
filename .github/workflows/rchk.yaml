# rchk (github.com/kalibera/rchk), the PROTECT-balance static analyzer CRAN
# itself runs on submission, over the compiled .Call bridge (src/R_interface*).
# Slow (an instrumented LLVM/clang build of the package), so scheduled +
# manual dispatch only, not per-push, mirroring equivalence.yaml.
on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

name: rchk

permissions: read-all

jobs:
  rchk:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Build the source tarball
        run: R CMD build --no-build-vignettes .

      - name: Run rchk over the built package
        run: |
          set -eo pipefail
          mkdir -p rchk-packages
          cp dbarts_*.tar.gz rchk-packages/
          tarball=$(basename rchk-packages/dbarts_*.tar.gz)
          docker run --rm -v "$PWD/rchk-packages:/rchk/packages" \
            kalibera/rchk:latest "/rchk/packages/$tarball" 2>&1 | tee rchk.log

      # bcheck tags real findings [PB] (protection stack imbalance) and [UP]
      # (unprotected variable live across an allocating call); maacheck's is
      # "WARNING Suspicious call ... unprotected arguments". Matching only
      # these tags - rather than denylisting rchk's benign notes, e.g. its
      # "too many states (abstraction error?)" bailout - keeps informational
      # output from failing the job. A confirmed false positive is excluded
      # here by its exact rchk output line, with a one-line reason; there are
      # none tracked yet.
      - name: Fail on new PROTECT-balance findings
        run: |
          set -eo pipefail
          findings=$(find rchk-packages \( -name '*.bcheck' -o -name '*.maacheck' \) \
            -exec cat {} + 2>/dev/null \
            | grep -E '^\s*\[(PB|UP)\]|WARNING Suspicious call' || true)
          if [ -n "$findings" ]; then
            echo "$findings"
            echo "::error::rchk reported PROTECT-balance findings; triage in review"
            exit 1
          fi

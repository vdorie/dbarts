# Cross-repo C ABI contract: builds stan4bart (the sole LinkingTo consumer
# of dbarts.h) from its pinned dev source against the candidate dbarts in
# this checkout, and runs stan4bart's test suite under AddressSanitizer.
#
# Motivation: the getTrees ABI break (2e2b1c9, restored a73ca50) was
# call-time stack garbage, not a link or load error - dbarts_sampler_getTrees
# gained a parameter under an unchanged symbol name, so stan4bart's
# hand-rolled declaration passed one argument too few and a garbage pointer
# corrupted extracted node counts stack-dependently. That failed ~half of
# R CMD check runs for a week rather than failing deterministically. ASAN
# turns that class of bug into a hard, repeatable crash instead of a coin
# flip. See docs/plans/capi-dispatch-table.md (Implementation plan, C0).
#
# Path-gated (allow-list, not the repo's usual deny-list) to the surface
# that can actually change the ABI: a change confined to R/, docs/, or
# benchmarks/ cannot break the C interface this job exists to protect, so
# it does not need an instrumented cross-repo build to prove that out.
name: abi-contract

on:
  push:
    branches: [main, master, bartcore]
    paths:
      - 'src/**'
      - 'inst/include/**'
      - '.github/workflows/abi-contract.yaml'
  pull_request:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'inst/include/**'
      - '.github/workflows/abi-contract.yaml'
  workflow_dispatch:

permissions: read-all

env:
  STAN4BART_REPO: vdorie/stan4bart
  # Pin to a specific commit rather than tracking the branch tip, so a
  # stan4bart-side regression cannot fail dbarts's CI out of the blue; bump
  # this deliberately (e.g. alongside a lockstep dbarts.h change landing on
  # both repos). Currently the tip of wt/walnuts as of authoring this
  # workflow (2026-07-16).
  STAN4BART_REF: bd4f1a23972e770f8c7fc9abe3fd9abd4d02160f

jobs:
  abi-contract:
    runs-on: ubuntu-latest
    # stan4bart's LinkingTo (Rcpp, RcppEigen) compiles from source here, on
    # top of an already-slower instrumented build and a full testthat suite;
    # generous headroom over the "tens of minutes" the uninstrumented
    # revdep-smoke build takes for the same package.
    timeout-minutes: 90

    container:
      image: ghcr.io/r-hub/containers/clang-asan:latest
    env:
      # leak detection is noisy against an uninstrumented R runtime; the
      # target here is memory-access errors and undefined behavior at the
      # dbarts/stan4bart call boundary (mirrors sanitizers.yaml)
      ASAN_OPTIONS: detect_leaks=0
      UBSAN_OPTIONS: print_stacktrace=1
      NOT_CRAN: true

    steps:
      - name: Check out dbarts (candidate)
        uses: actions/checkout@v7

      - name: Install dbarts under ASAN+UBSAN
        run: R CMD INSTALL --preclean .

      - name: Check out stan4bart (pinned consumer)
        uses: actions/checkout@v7
        with:
          repository: ${{ env.STAN4BART_REPO }}
          ref: ${{ env.STAN4BART_REF }}
          path: stan4bart-src

      - name: Install stan4bart's package dependencies
        shell: Rscript {0}
        run: |
          if (!requireNamespace("remotes", quietly = TRUE)) {
            install.packages("remotes", repos = "https://cloud.r-project.org")
          }
          # dependencies = TRUE also pulls in Suggests (testthat, lme4,
          # reformulas): unlike the monthly revdep-smoke job (which only
          # needs Depends/Imports/LinkingTo for R CMD check and explicitly
          # skips Suggests to dodge a bartCause/stan4bart cycle), this job
          # runs stan4bart's own test suite directly, so the Suggests it
          # exercises must be installed. dbarts itself is already installed
          # above and satisfies the (>= 1.0-0) floor, so this does not
          # reinstall it.
          remotes::install_deps("stan4bart-src", dependencies = TRUE)

      - name: Build stan4bart under ASAN+UBSAN against the candidate dbarts
        run: R CMD INSTALL --preclean stan4bart-src

      - name: Run stan4bart's test suite under ASAN+UBSAN
        working-directory: stan4bart-src/tests
        shell: bash
        run: |
          set -eo pipefail
          # test_check()'s default stop_on_failure = TRUE throws (and so
          # exits non-zero) on any failed expectation; unlike tinytest's
          # test_package() (see sanitizers.yaml) this needs no manual
          # pass/fail parsing - a test failure alone already fails this step.
          Rscript testthat.R 2>&1 | tee "${{ github.workspace }}/stan4bart-tests.log"
          # a sanitizer finding does not necessarily fail an expectation
          # (e.g. a report printed to stderr around an otherwise-passing
          # test); catch that the same way sanitizers.yaml does
          if grep -Eq "runtime error:|AddressSanitizer|SUMMARY: .*Sanitizer" "${{ github.workspace }}/stan4bart-tests.log"; then
            echo "::error::sanitizer reported a finding"; exit 1
          fi

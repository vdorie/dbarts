# Deterministic correctness gates for the bartcore MCMC engine: the balance
# gates (birth/death, change, swap detailed balance) and the exact-posterior /
# reference gates (aft, bcf, categorical, hazard, heteroscedastic, hurdle,
# linear, multinomial, negbin, ordinal, t, logistic, monotone). Each script
# drives a long MCMC run with a fixed seed and compares the engine's draws to
# an analytic or brute-force-enumerated target with a z-score / tolerance bound
# it computes IN-SCRIPT (no recorded baseline), then quit(status=1L) on
# deviation. That makes them deterministic regression detectors that catch
# engine-math breakage without false-alarming, so they gate push /
# pull_request -- unlike the STATISTICAL gates (sbc.yaml, equivalence.yaml)
# whose rank-uniformity / z-mode tests occasionally false-alarm at the nominal
# level and stay schedule / workflow_dispatch only.
#
# Because the target is derived in-script (not a machine-specific recorded
# draw), the gates are host-portable, so this runs on the cheaper
# ubuntu-latest -- the arch-pinned macos-latest of cpp-tests.yaml is only
# needed where bitwise baselines are compared.
#
# One further step, after the loop, does read recorded baselines: the BCF and
# multinomial equivalence harnesses in --cross-host mode. Those baselines are
# recorded on arm64/macOS, so bitwise is unavailable here by construction and
# the flag is what makes the comparison meaningful off-host -- it exempts the
# point-in-time snapshot channels and gates every draws-axis channel under a
# two-tier verdict whose tier 1 is a tight deviation bound. That makes this
# workflow the per-push half of the cross-host gate; equivalence.yaml carries
# the weekly half and the gaussian arm.
#
# One job installs the package once, then runs every gate in `quick` mode
# (reduced draws/seeds) so the whole suite shares a single ~4-minute C++20
# compile instead of recompiling per gate. Every gate runs even if an earlier
# one fails (so all failures surface in one run); a failing gate is emitted as
# an ::error:: annotation and the job exits nonzero. Dispatch with mode=full
# for the long (non-quick) grid, or run `Rscript benchmarks/R/<gate>.R`
# locally. benchmarks/ is .Rbuildignore'd and does not ship, so the gates run
# against the installed build.
on:
  push:
    branches: [main, bartcore]
    # docs- and TODO-only pushes cannot change engine math or the gates;
    # MANIFEST is provenance prose, read by no script this workflow runs
    paths-ignore:
      - 'docs/**'
      - 'TODO'
      - '**.md'
      - 'benchmarks/baselines/MANIFEST'
  pull_request:
    branches: [main, bartcore]
  workflow_dispatch:
    inputs:
      mode:
        description: 'gate mode: quick (fast, per-push) or full (long)'
        default: quick
        type: choice
        options: [quick, full]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

name: exact-gates

permissions: read-all

jobs:
  exact-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      # apt-get has been observed to stall indefinitely against the Ubuntu
      # archive mirror on hosted runners (both here and inside the system
      # requirements install below); bounded retries turn a stall into a
      # fast failure instead of one that burns the whole job timeout.
      - name: Bound apt network stalls
        run: |
          echo 'Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/99-ci-retry
          echo 'Acquire::http::Timeout "15";' | sudo tee -a /etc/apt/apt.conf.d/99-ci-retry
          echo 'Acquire::https::Timeout "15";' | sudo tee -a /etc/apt/apt.conf.d/99-ci-retry

      - uses: r-lib/actions/setup-r@v2
        timeout-minutes: 12
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        timeout-minutes: 15
        with:
          needs: check
          # BART is not a dbarts dependency; it is the independent
          # implementation logistic-reference.R's part 2 gates against, so
          # installed here (not added to DESCRIPTION) the same way lint.yaml
          # and pkgdown.yaml pull in their own extra tools. RSPM serves it as
          # a prebuilt binary (as it does its NeedsCompilation: yes deps
          # Rcpp/nlme; survival is already a dbarts Suggests), so this adds
          # under a minute, not a source compile.
          extra-packages: any::BART

      - name: Install the package
        run: R CMD INSTALL .

      - name: Run the gates
        # quick on every push / PR; mode=full only when dispatched with it set.
        # GHA ternary: the truthy branch must be 'quick' (the empty full-mode
        # arg is the || fallback), so test for NOT-full rather than full.
        env:
          GATE_ARG: ${{ !(github.event_name == 'workflow_dispatch' && inputs.mode == 'full') && 'quick' || '' }}
        run: |
          gates="
            bd-balance.R change-balance.R swap-balance.R
            aft-exact.R backfit-exact.R bcf-exact.R bcf-exact-weak.R bcf-exact-restricted.R
            categorical-exact.R heteroscedastic-exact.R linear-exact.R
            hazard-exact.R hurdle-exact.R
            multinomial-exact.R negbin-exact.R ordinal-exact.R t-exact.R
            logistic-reference.R monotone-reference.R
            hazard-reduction.R hurdle-reduction.R
          "
          fail=0
          for g in $gates; do
            echo "::group::$g"
            if Rscript "benchmarks/R/$g" ${GATE_ARG}; then
              echo "PASS $g"
            else
              echo "::error::gate $g FAILED"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

      # Outside the loop above on purpose: that loop passes `quick` to every
      # gate, and these baselines are recorded at FULL settings, which each
      # harness settings guard refuses to compare against a quick run. Runs
      # even after a failing gate so one run surfaces every failure.
      # Both compares finish in about a second on a 2020 desktop, against the
      # ~4-minute install and 30-minute timeout of this job. The baseline hashes are
      # pinned here and in equivalence.yaml, so a re-record repins both.
      - name: Run the cross-host equivalence compares
        if: ${{ !cancelled() }}
        run: |
          fail=0
          echo "::group::bcf-equivalence --cross-host"
          if Rscript benchmarks/R/bcf-equivalence.R compare \
            benchmarks/baselines/bcf-equivalence-00cfa108.rds --cross-host; then
            echo "PASS bcf-equivalence"
          else
            echo "::error::cross-host gate bcf-equivalence FAILED"
            fail=1
          fi
          echo "::endgroup::"
          echo "::group::multinomial-equivalence --cross-host"
          if Rscript benchmarks/R/multinomial-equivalence.R compare \
            benchmarks/baselines/multinomial-equivalence-4d9a3337.rds \
            --cross-host; then
            echo "PASS multinomial-equivalence"
          else
            echo "::error::cross-host gate multinomial-equivalence FAILED"
            fail=1
          fi
          echo "::endgroup::"
          exit $fail

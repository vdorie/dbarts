# ASAN + UBSAN (clang and gcc builds) over the compiled engine and the .Call
# bridge, on the r-hub sanitizer containers (instrumented R-devel builds).
# The rewritten pointer-heavy C++20 engine is exactly the kind of code CRAN's
# clang-san/gcc-san rebuilds bite, so catching a finding here is much cheaper
# than a CRAN bounce. The component tests (tests/cpp) already pass native
# ASAN+UBSAN builds locally; this widens coverage to the bridge, the support
# libraries, and the full tinytest scenario set under instrumented R builds.
# valgrind memcheck (20-50x slower - ~an hour, and it grows with the suite)
# is split into valgrind.yaml, run nightly + on demand instead of per-push,
# so this fast gate stays under ~10 min. The ASAN legs are the per-push
# memory-safety gate; valgrind adds uninitialized-read coverage that does
# not need to block every push.
name: sanitizers

on:
  push:
    branches: [main, master, bartcore]
    # instrumented rebuilds cost ~an hour; documentation- and
    # benchmark-data-only pushes cannot change what they test
    paths-ignore:
      - 'docs/**'
      - 'TODO'
      - '**.md'
      - 'benchmarks/**'
  pull_request:
    branches: [main, master, bartcore]
    paths-ignore:
      - 'docs/**'
      - 'TODO'
      - '**.md'
      - 'benchmarks/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  asan-ubsan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    name: ${{ matrix.container }} ASAN+UBSAN

    strategy:
      fail-fast: false
      matrix:
        container: [clang-asan, gcc-asan]

    container:
      image: ghcr.io/r-hub/containers/${{ matrix.container }}:latest
    env:
      # leak detection is noisy against an uninstrumented R runtime; the
      # target here is memory-access errors and undefined behavior
      ASAN_OPTIONS: detect_leaks=0
      UBSAN_OPTIONS: print_stacktrace=1
    steps:
      - uses: actions/checkout@v7

      - name: Install test dependencies
        shell: Rscript {0}
        run: |
          need <- setdiff(c("tinytest", "Matrix", "survival", "posterior"), rownames(installed.packages()))
          if (length(need)) install.packages(need, repos = "https://cloud.r-project.org")

      - name: Install dbarts under sanitizers
        run: R CMD INSTALL --preclean .

      - name: Unit tests under ASAN+UBSAN
        shell: bash
        run: |
          set -eo pipefail
          # a test failure quits non-zero (via the return value, not by parsing
          # test_package's printed summary); pipefail + set -e propagate it
          Rscript -e '
            res <- tinytest::test_package("dbarts")
            print(res)
            ok <- vapply(res, function(t) isTRUE(as.logical(t)[1]), logical(1))
            if (length(ok) == 0L || !all(ok)) quit(status = 1L, save = "no")

            # Total-count floor: guards against a refactor that silently
            # empties whole test files (a passing suite of zero assertions
            # looks green). The floor is 5200 - ~10% headroom under the
            # suite's size - so routine growth does not trip it and a
            # file-emptying refactor does.
            if (length(ok) < 5200L) {
              cat(sprintf(
                "::error::tinytest produced only %d results, expected >= 5200\n",
                length(ok)
              ))
              quit(status = 1L, save = "no")
            }

            # Per-file floors for the highest-value files, each set at
            # ~60-65% of its measured count so routine growth does not trip
            # it but a file-emptying regression does. test-simd.R
            # legitimately exit_file()s with zero assertions on a
            # scalar-only host; run_test_dir() in tinytest unlist()s
            # per-file results, so an exit_file()d file contributes nothing
            # to `res` with no marker distinguishing it from silent
            # breakage (verified locally: run_test_file() on an exit_file()d
            # script returns a zero-length "tinytests" object with no skip
            # attribute) - so its floor is a documented no-op; real SIMD
            # coverage is the NEON-forced arm64 leg in check-standard.yaml,
            # which pins bitwise equality rather than a count.
            byFile <- table(vapply(res, function(t) attr(t, "file"), character(1)))
            floors <- c(
              "test-capi.R" = 150L,
              "test-simd.R" = 0L,
              "test-bcf-r5-surface.R" = 30L,
              "test-multinomial-surface.R" = 80L,
              "test-argument-surface.R" = 60L,
              "test-bartcore.R" = 160L
            )
            for (f in names(floors)) {
              n <- if (f %in% names(byFile)) byFile[[f]] else 0L
              if (n < floors[[f]]) {
                cat(sprintf(
                  "::error::%s produced only %d results, expected >= %d\n",
                  f, n, floors[[f]]
                ))
                quit(status = 1L, save = "no")
              }
            }
          ' 2>&1 | tee sanitizer-tests.log
          # a sanitizer finding that does not fail an assertion (e.g. a UBSAN
          # "runtime error:" printed during an otherwise-passing test) still fails
          if grep -Eq "runtime error:|AddressSanitizer|SUMMARY: .*Sanitizer" sanitizer-tests.log; then
            echo "::error::sanitizer reported a finding"; exit 1
          fi

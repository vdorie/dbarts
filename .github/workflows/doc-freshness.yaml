# Checks docs/design and docs/plans freshness against the code (see
# tools/check-doc-freshness.R). Split out from lint.yaml's doc-freshness job:
# that job's paths-ignore excluded docs/**, TODO and **.md, which are exactly
# this check's own inputs, so it never ran on the commits it exists to check.
# No paths-ignore here on purpose. No package install: the script only reads
# tracked files and git metadata, it does not load dbarts.
on:
  push:
    branches: [main, bartcore]
  pull_request:
    branches: [main, bartcore]
  workflow_dispatch:

# On bartcore each commit is its own group, so a push never cancels the
# previous commit's run; elsewhere a newer push supersedes an older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/bartcore' && github.sha || github.ref }}
  cancel-in-progress: true

name: doc-freshness

permissions: read-all

jobs:
  doc-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # full history: the guard resolves every cited commit with git
          # and fails outright on a shallow clone
          fetch-depth: 0

      # a device name (aux.md) or a character NTFS refuses fails the Windows
      # checkout, and a docs-only push runs no Windows job to say so
      - name: Refuse paths Windows cannot check out
        run: |
          bad=$(git ls-files | grep -iE '(^|/)(con|prn|aux|nul|com[0-9]|lpt[0-9])(\.[^/]*)?(/|$)|[<>:"|?*\\]|[. ](/|$)' || true)
          if [ -n "$bad" ]; then
            echo "paths Windows cannot check out:"
            echo "$bad"
            exit 1
          fi

      - uses: r-lib/actions/setup-r@v2
        timeout-minutes: 12
        with:
          use-public-rspm: true

      - name: Check design/plan doc freshness
        run: Rscript tools/check-doc-freshness.R .

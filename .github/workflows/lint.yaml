# Enforces the checked-in .lintr config and the air formatter (air.toml).
# Both jobs hard-fail on any finding. Workflow derived from
# https://github.com/r-lib/actions/tree/v2/examples and
# https://github.com/posit-dev/setup-air
on:
  push:
    branches: [main, master, bartcore]
    # lintr and air check R files only; benchmarks/R stays linted, so
    # only non-code trees are ignored
    paths-ignore:
      - 'docs/**'
      - 'TODO'
      - '**.md'
      - 'benchmarks/baselines/**'
  pull_request:
    branches: [main, master, bartcore]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

name: lint.yaml

permissions: read-all

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      # apt-get has been observed to stall indefinitely against the Ubuntu
      # archive mirror on hosted runners (both here and inside the system
      # requirements install below); bounded retries turn a stall into a
      # fast failure instead of one that burns the whole job timeout.
      - name: Bound apt network stalls
        run: |
          echo 'Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/99-ci-retry
          echo 'Acquire::http::Timeout "15";' | sudo tee -a /etc/apt/apt.conf.d/99-ci-retry
          echo 'Acquire::https::Timeout "15";' | sudo tee -a /etc/apt/apt.conf.d/99-ci-retry

      - uses: r-lib/actions/setup-r@v2
        timeout-minutes: 12
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        timeout-minutes: 15
        with:
          extra-packages: any::lintr, local::.
          needs: lint

      - name: Lint
        run: lintr::lint_package()
        shell: Rscript {0}
        env:
          LINTR_ERROR_ON_LINT: true

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: posit-dev/setup-air@v1

      - name: Check formatting
        run: air format --check .

  doc-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        timeout-minutes: 12
        with:
          use-public-rspm: true

      - name: Check Windows config header drift
        run: Rscript tools/check-win-drift.R .

      - name: Check design/plan doc freshness
        run: Rscript tools/check-doc-freshness.R .

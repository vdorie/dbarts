# Enforces the checked-in .lintr config, the air formatter (air.toml), and
# the removed-configure-option stubs (dec-B107). All jobs hard-fail on any
# finding. Workflow derived from
# https://github.com/r-lib/actions/tree/v2/examples and
# https://github.com/posit-dev/setup-air
on:
  push:
    branches: [main, bartcore]
    # lintr and air check R files only, and configure-stubs checks
    # configure/configure.ac directly, so only non-code trees are ignored;
    # neither configure nor configure.ac is in this list, so a
    # configure-only push still runs configure-stubs
    paths-ignore:
      - 'docs/**'
      - 'TODO'
      - '**.md'
      - 'benchmarks/baselines/**'
  pull_request:
    branches: [main, bartcore]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

name: lint.yaml

permissions: read-all

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      # apt-get has been observed to stall indefinitely against the Ubuntu
      # archive mirror on hosted runners (both here and inside the system
      # requirements install below); bounded retries turn a stall into a
      # fast failure instead of one that burns the whole job timeout.
      - name: Bound apt network stalls
        run: |
          echo 'Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/99-ci-retry
          echo 'Acquire::http::Timeout "15";' | sudo tee -a /etc/apt/apt.conf.d/99-ci-retry
          echo 'Acquire::https::Timeout "15";' | sudo tee -a /etc/apt/apt.conf.d/99-ci-retry

      - uses: r-lib/actions/setup-r@v2
        timeout-minutes: 12
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        timeout-minutes: 15
        with:
          extra-packages: any::lintr, local::.
          needs: lint

      - name: Lint
        run: lintr::lint_package()
        shell: Rscript {0}
        env:
          LINTR_ERROR_ON_LINT: true

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: posit-dev/setup-air@v1

      - name: Check formatting
        run: air format --check .

  doc-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        timeout-minutes: 12
        with:
          use-public-rspm: true

      - name: Check Windows config header drift
        run: Rscript tools/check-win-drift.R .

      - name: Check dbartsSampler Rd usage against live formals
        run: Rscript tools/check-rc-codoc.R .

      # No package build: verify-anchors just greps the mutation sites.
      - name: Check mutation-battery anchors against the current tree
        run: Rscript benchmarks/R/mutation-battery.R verify-anchors

  configure-stubs:
    # The stubs fire before configure looks for R, but the no-flag run
    # needs R RHOME to succeed, so R is installed (no packages).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        timeout-minutes: 12
        with:
          use-public-rspm: true

      - name: Check the removed configure options stop with a message (dec-B107)
        # GitHub runs `run:` under bash -e, which would abort at the first
        # stub's nonzero exit before the status is inspected
        run: |
          set +e
          fail=0

          check_stub() {
            dir=$(mktemp -d)
            (cd "$dir" && "$GITHUB_WORKSPACE/configure" "$1" >out.log 2>&1)
            status=$?
            if [ "$status" -eq 0 ]; then
              echo "FAIL: $1 exited 0, expected nonzero"
              cat "$dir/out.log"
              fail=1
            elif ! grep -q "removed for 1.0-0" "$dir/out.log" \
              || ! grep -q "$2" "$dir/out.log"; then
              echo "FAIL: $1 did not name the removal"
              cat "$dir/out.log"
              fail=1
            fi
          }

          check_stub --enable-match-bayes-tree match-bayes-tree
          check_stub --enable-thread-safe-unload thread-safe-unload
          check_stub --with-xint-size=32 xint-size

          dir=$(mktemp -d)
          (cd "$dir" && "$GITHUB_WORKSPACE/configure" >out.log 2>&1)
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "FAIL: configure with no flags exited $status, expected 0"
            cat "$dir/out.log"
            fail=1
          fi

          exit "$fail"

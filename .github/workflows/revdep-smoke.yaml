# Monthly smoke test against the three reverse dependencies dev dbarts is
# most likely to break: stan4bart and treatSens, the two compiled-boundary
# dbarts.h consumers (LinkingTo: dbarts), and bartCause, the same-maintainer
# R-surface consumer. Between releases nothing else watches them; this
# surfaces breakage before the next lockstep release rather than at the full
# manual revdep sweep.
#
# Sources come from each repo's default branch, not CRAN: the CRAN releases
# predate the bartcore rework and cannot pair with the dev dbarts installed
# from this checkout. Branches: stan4bart main, bartCause main, treatSens
# master.
#
# stan4bart's build against dbarts.h takes tens of minutes, hence the
# generous timeout and monthly (not per-push) cadence.
#
# NOTE: GitHub binds only `schedule` to the repository DEFAULT branch, which
# is main, so the monthly cadence runs there. `workflow_dispatch` fires from
# any branch this file is on. A push to main touching this file is the third
# trigger.
on:
  schedule:
    - cron: '0 8 1 * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/revdep-smoke.yaml'

name: revdep-smoke

permissions: read-all

jobs:
  revdep-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    name: revdep-smoke (${{ matrix.package }})

    strategy:
      fail-fast: false
      matrix:
        package: [stan4bart, bartCause, treatSens]
        include:
          - package: stan4bart
            branch: main
          - package: bartCause
            branch: main
          - package: treatSens
            branch: master

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      _R_CHECK_FORCE_SUGGESTS_: false

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::remotes
          needs: check

      - name: Install dev dbarts from this checkout
        run: R CMD INSTALL .

      - name: Fetch ${{ matrix.package }} from its default branch
        run: |
          git clone --depth 1 --branch "${{ matrix.branch }}" \
            "https://github.com/vdorie/${{ matrix.package }}.git" "${{ matrix.package }}"

      # hard dependencies only: suggested packages are skipped by the check
      # (_R_CHECK_FORCE_SUGGESTS_), and bartCause suggests stan4bart, whose
      # CRAN release cannot pair with the dev dbarts installed above
      - name: Install ${{ matrix.package }} dependencies
        run: Rscript -e 'remotes::install_deps("${{ matrix.package }}", dependencies = NA)'

      # check the BUILT tarball: R CMD build is what derives Author and
      # Maintainer from Authors@R, and a check on the source directory fails
      # at DESCRIPTION for both consumers
      - name: R CMD check ${{ matrix.package }}
        run: |
          R CMD build --no-build-vignettes --no-manual "${{ matrix.package }}"
          R CMD check --no-manual "${{ matrix.package }}"_*.tar.gz

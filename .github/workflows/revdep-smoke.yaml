# Monthly smoke test against the three reverse dependencies dev dbarts is
# most likely to break: stan4bart and treatSens, the two compiled-boundary
# dbarts.h consumers (LinkingTo: dbarts), and bartCause, the same-maintainer
# R-surface consumer. Between releases nothing else watches them; this
# surfaces breakage before the next lockstep release rather than at the full
# manual revdep sweep.
#
# Sources come from each repo's compat branch, not CRAN: the CRAN releases
# predate the bartcore rework and cannot pair with the dev dbarts installed
# from this checkout. Branches: stan4bart bartcore, bartCause dbarts-1.0,
# treatSens dbarts-1.0. Once the coordinated lockstep release ships, the
# branch refs in the matrix below flip to each repo's main.
#
# stan4bart's build against dbarts.h takes tens of minutes, hence the
# generous timeout and monthly (not per-push) cadence.
#
# NOTE: GitHub binds `schedule` to the repository DEFAULT branch, so this run
# does not fire until the workflow lands on main; on bartcore it is
# workflow_dispatch (manual) only. See valgrind.yaml's header.
on:
  schedule:
    - cron: '0 8 1 * *'
  workflow_dispatch:

name: revdep-smoke

permissions: read-all

jobs:
  revdep-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    name: revdep-smoke (${{ matrix.package }})

    strategy:
      fail-fast: false
      matrix:
        package: [stan4bart, bartCause, treatSens]
        include:
          - package: stan4bart
            branch: bartcore
          - package: bartCause
            branch: dbarts-1.0
          - package: treatSens
            branch: dbarts-1.0

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      _R_CHECK_FORCE_SUGGESTS_: false

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::remotes
          needs: check

      - name: Install dev dbarts from this checkout
        run: R CMD INSTALL .

      - name: Fetch ${{ matrix.package }} from its compat branch
        run: |
          git clone --depth 1 --branch "${{ matrix.branch }}" \
            "https://github.com/vdorie/${{ matrix.package }}.git" "${{ matrix.package }}"

      # hard dependencies only: suggested packages are skipped by the check
      # (_R_CHECK_FORCE_SUGGESTS_), and bartCause suggests stan4bart, whose
      # CRAN release cannot pair with the dev dbarts installed above
      - name: Install ${{ matrix.package }} dependencies
        run: Rscript -e 'remotes::install_deps("${{ matrix.package }}", dependencies = NA)'

      - name: R CMD check ${{ matrix.package }}
        run: R CMD check --no-manual "${{ matrix.package }}"

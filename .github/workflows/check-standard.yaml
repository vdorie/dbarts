# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, bartcore]
    # documentation- and benchmark-only pushes cannot change what R CMD
    # check builds and tests (benchmarks/ and docs/ are .Rbuildignore'd)
    paths-ignore:
      - 'docs/**'
      - 'TODO'
      - '**.md'
      - 'benchmarks/**'
  pull_request:
    branches: [main, bartcore]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 30

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - name: Configure git
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      # apt-get has been observed to stall indefinitely against the Ubuntu
      # archive mirror on hosted runners (both inside setup-r below and
      # inside the system requirements install); bounded retries turn a
      # stall into a fast failure instead of one that burns the whole job
      # timeout. Linux-only: the matrix also runs on macOS and Windows,
      # which have no apt.
      - name: Bound apt network stalls
        if: runner.os == 'Linux'
        run: |
          echo 'Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/99-ci-retry
          echo 'Acquire::http::Timeout "15";' | sudo tee -a /etc/apt/apt.conf.d/99-ci-retry
          echo 'Acquire::https::Timeout "15";' | sudo tee -a /etc/apt/apt.conf.d/99-ci-retry

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        timeout-minutes: 15
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        timeout-minutes: 20
        with:
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--no-build-vignettes")'
          args: 'c("--no-manual","--ignore-vignettes")'

  # Native arm64 validation of the NEON config: compile the
  # _neon kernels under Rtools-aarch64 and prove scalar-vs-NEON bitwise
  # agreement. Scoped to install + the SIMD test rather than a full check:
  # the win-aarch64 toolchain is experimental and Suggests must build from
  # source, so a full check would let unrelated flakiness mask the signal.
  windows-arm64-neon:
    runs-on: windows-11-arm
    timeout-minutes: 15

    name: windows-11-arm (release, NEON)

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Configure git
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install tinytest
        run: Rscript -e 'install.packages("tinytest", repos = "https://cloud.r-project.org")'

      - name: Build and install dbarts
        # bash, not the default pwsh: PowerShell aliases R to Invoke-History
        shell: bash
        run: R CMD INSTALL --preclean .

      - name: Assert native arm64 with NEON available
        run: Rscript -e 'stopifnot(R.version$arch %in% c("aarch64", "arm64", "arm"), .Call(dbarts:::C_dbarts_getMaxSIMDInstructionSet) >= 1L)'

      - name: Run the SIMD reproducibility test
        # NEON presence is proven by the prior step, so the floor is
        # test-simd.R's exact count: one expect_equal from the short-data
        # block plus one from the long-data block.
        # This is the only leg in this workflow with an R-level tinytest
        # results object to assert on - the R-CMD-check matrix above runs
        # tests opaquely inside r-lib/actions/check-r-package (R CMD check
        # invokes tests/tinytest.R itself; no results object reaches this
        # YAML without re-running the suite), so it does not gain a
        # whole-suite floor here. That whole-suite floor already runs on
        # every push/PR via sanitizers.yaml.
        run: Rscript -e 'res <- tinytest::run_test_file(system.file("tinytest", "test-simd.R", package = "dbarts")); print(res); stopifnot(length(res) >= 2L, all(sapply(res, isTRUE)))'

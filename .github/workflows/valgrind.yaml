# valgrind memcheck over the compiled engine, the .Call bridge, and the
# support libraries under an instrumented R-devel build (r-hub valgrind
# container). memcheck runs 20-50x slower than native (~an hour, and rising
# with the tinytest suite), so it does not gate every push - the fast
# clang/gcc ASAN legs in sanitizers.yaml are the per-push memory-safety
# gate; valgrind adds uninitialized-read (--track-origins) coverage on a
# nightly cadence plus on demand.
#
# NOTE: GitHub fires `schedule` from the repository DEFAULT branch only, so
# the nightly cron is idle until this workflow lands on main. On bartcore a
# run comes from a push that touches this file or from `gh workflow run
# valgrind --ref bartcore`. Validate the schedule when bartcore merges to
# main, alongside the other scheduled workflows.
name: valgrind

on:
  schedule:
    - cron: '0 7 * * *'   # ~nightly; fires from the default branch only
  workflow_dispatch:
  push:
    branches: [bartcore]
    paths:
      - '.github/workflows/valgrind.yaml'

permissions: read-all

jobs:
  valgrind:
    runs-on: ubuntu-latest
    name: valgrind
    # memcheck's instruction-level emulation runs 20-50x slower than native;
    # a generous explicit timeout keeps a genuine hang from just riding out
    # the default job timeout unexplained
    timeout-minutes: 180

    container:
      image: ghcr.io/r-hub/containers/valgrind:latest

    steps:
      - uses: actions/checkout@v7

      - name: Install test dependencies
        shell: Rscript {0}
        run: |
          need <- setdiff(c("tinytest", "Matrix", "survival"), rownames(installed.packages()))
          if (length(need)) install.packages(need, repos = "https://cloud.r-project.org")

      - name: Install dbarts
        run: R CMD INSTALL --preclean .

      # -d valgrind wraps the R binary itself, not the package under test.
      # VALGRIND_OPTS replaces the image's (--track-origins=yes
      # --leak-check=full) to count only definite and indirect leaks as
      # errors: valgrind's default also counts possible ones, which forked
      # workers (parallel's mclapply) report from R's own and glibc's
      # allocations - thread-local storage, gettext, setenv. Every leak record
      # is still printed, and memory errors (invalid reads and writes,
      # uninitialised use, mismatched frees) count as before. A possible leak
      # this package allocated is caught by the guard below instead: a
      # possibly-lost record fails when its allocation site is package code.
      # The allocation site is the first frame below the allocator that is
      # neither a further allocator (ld.so's calloc, say) nor libstdc++
      # template code inlined into its caller, so a block allocated inside
      # glibc or R passes even with a package frame further up the stack
      # (gettext's cache under the interrupt poll, a thread's TLS under
      # pthread_create). --fullpath-after prints this package's sources as
      # src/..., which tells a frame of ours from R's own src/main.
      - name: Unit tests under valgrind
        shell: bash
        run: |
          set -eo pipefail
          export VALGRIND_OPTS="--track-origins=yes --leak-check=full \
            --errors-for-leak-kinds=definite,indirect --fullpath-after=$PWD/"
          R -d valgrind --vanilla -e '
            res <- tinytest::test_package("dbarts")
            print(res)
            ok <- vapply(res, function(t) isTRUE(as.logical(t)[1]), logical(1))
            if (length(ok) == 0L || !all(ok)) quit(status = 1L, save = "no")
          ' 2>&1 | tee valgrind-tests.log
          # a possibly-lost record allocated by package code (see above);
          # records are per process, and a record ends at that process's
          # blank line. awk exits 0 on a finding and 1 on none; any other
          # status is a guard that did not run, and fails too
          rc=0
          awk '
            function finish(p) {
              if (pkg[p]) { print head[p]; found = 1 }
              open[p] = 0
            }
            { if (!match($0, /==[0-9]+==/)) next
              pid = substr($0, RSTART, RLENGTH) }
            /are possibly lost in loss record/ {
              open[pid] = 1; head[pid] = $0
              pkg[pid] = 0; frames[pid] = 0; decided[pid] = 0
              next
            }
            !open[pid] { next }
            $0 ~ (pid " *$") { finish(pid); next }
            !/ (at|by) 0x[0-9A-Fa-f]+: / || decided[pid] { next }
            # the first frame is the allocator valgrind replaces
            frames[pid]++ == 0 { next }
            /: (malloc|calloc|realloc|memalign|posix_memalign|aligned_alloc) [(]/ { next }
            /: operator new/ || /\/c[+][+]\// || /libstdc[+][+]/ { next }
            { decided[pid] = 1; pkg[pid] = /dbarts[.]so/ || /[(]src\// }
            END { for (p in open) if (open[p]) finish(p); exit !found }
          ' valgrind-tests.log || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "::error::a possibly-lost block was allocated by dbarts"; exit 1
          elif [ "$rc" -ne 1 ]; then
            echo "::error::the possibly-lost guard did not run"; exit 1
          fi
          # --errors-for-leak-kinds folds definitely/indirectly-lost blocks
          # into the error count, so a nonzero ERROR SUMMARY covers both
          # memory-access errors and those leaks
          if grep -Eq "ERROR SUMMARY: [1-9]" valgrind-tests.log; then
            echo "::error::valgrind reported a finding"; exit 1
          fi

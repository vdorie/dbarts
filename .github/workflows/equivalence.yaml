# Statistical-equivalence gate (benchmarks/R/equivalence.R compare), z-mode
# only: bitwise exactness is RNG- and machine-dependent and stays a local,
# same-machine check (see benchmarks/README.md). Any runner OS works here,
# so this runs on the cheaper ubuntu-latest rather than cpp-tests.yaml's
# arch-pinned macos-latest. --strict-coverage turns a scenario the baseline
# predates into a failure instead of a warning.
#
# bcf-equivalence and multinomial-equivalence are the same gate over the BCF
# and multinomial harnesses (benchmarks/R/bcf-equivalence.R,
# multinomial-equivalence.R): same runner class, same
# benchmarks/baselines/<harness>-<hash>.rds convention, one job per harness so
# they run in parallel. Neither script accepts --strict-coverage (gaussian's
# harness only) or reads EQUIVALENCE_CORES (gaussian's harness only, for its
# much larger scenario/seed grid); both compare their full scenario set with
# no extra flags.
#
# NOTE: GitHub binds `schedule` to the repository DEFAULT branch, so this run
# does not fire until the workflow lands on main; on bartcore it is
# workflow_dispatch (manual) only. See valgrind.yaml's header.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

name: equivalence

permissions: read-all

jobs:
  equivalence:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check

      - name: Install the package
        run: R CMD INSTALL .

      # Full (non-quick) scenario/seed grid, fork-parallelized so it still
      # finishes quickly; quick's reduced seeds/iterations can't be compared
      # against a baseline recorded at full settings (equivalence.R enforces
      # matching settings).
      - name: Set EQUIVALENCE_CORES to the runner's core count
        run: echo "EQUIVALENCE_CORES=$(nproc)" >> "$GITHUB_ENV"

      - name: Run the statistical equivalence gate
        run: |
          Rscript benchmarks/R/equivalence.R compare \
            benchmarks/baselines/equivalence-8b047f8b.rds --strict-coverage

  bcf-equivalence:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check

      - name: Install the package
        run: R CMD INSTALL .

      - name: Run the BCF statistical equivalence gate
        run: |
          Rscript benchmarks/R/bcf-equivalence.R compare \
            benchmarks/baselines/bcf-equivalence-6e3b9fb8.rds

  multinomial-equivalence:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check

      - name: Install the package
        run: R CMD INSTALL .

      - name: Run the multinomial statistical equivalence gate
        run: |
          Rscript benchmarks/R/multinomial-equivalence.R compare \
            benchmarks/baselines/multinomial-equivalence-1027be5.rds

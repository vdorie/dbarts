# The deterministic correctness gates of exact-gates.yaml in their FULL mode,
# weekly. exact-gates.yaml runs every gate in quick mode on each push and
# runs full only when dispatched by hand with mode=full; the monotone
# enumeration gate's full mode (triple the draws, about three times its quick
# run) passes that workflow's 40-minute job limit and so ran nowhere in CI.
# This workflow runs it, and the other gates' full modes with it, on a longer
# limit (dec-A132, dec-B301; docs/plans/check-shape-fixes.md).
#
# Two jobs:
#   gates-full  every gate and arm exact-gates.yaml's main job runs, in full
#               mode, both lists read from that file so the two cannot drift.
#               On the hosted runner the list took 88 minutes on 2026-11-08
#               and about 121 on 2026-11-09, a slower runner (each gate 1.2 to
#               1.6 times its 11-08 time). The longest gates, 11-08 and 11-09:
#               outer-step-exact 24.5 and about 38 minutes (its last arm cut
#               off at the old 30-minute limit, projected), mask-redraw-exact
#               10 and 16, probit-k-scale-exact 12 and 15, forest-prior-exact
#               10 and 13, logistic-reference 10.5 and 12; the rest under 7.
#               Each gate has its own limit, 30 minutes (45 for
#               logistic-reference, 60 for outer-step-exact), so one that hangs
#               costs that and the rest still run; the job's 240 minutes covers
#               the list at the 11-09 pace and the two longest limits spent
#               hanging. bcf-latent-exact.R stays in
#               quick mode, as it does under mode=full in exact-gates.yaml: its
#               full grid is about 40 minutes on the laptop alone.
#   monotone-enumeration-full
#               the enumeration gate, one job per prior, and the successive-
#               conditional check beside it, both in full mode. The enumeration
#               gate is about 14 minutes per prior on the laptop (quick: 4.5),
#               so up to 30 on the runner; its step limit is 60 minutes and the
#               check's, 25 seconds on the laptop, 10.
#
# A failing gate fails the job; every gate still runs, so one run shows every
# failure. The cross-host compares and the seeded-drift snapshot files of
# exact-gates.yaml are not repeated: they do not depend on the mode.
#
# NOTE: GitHub binds only `schedule` to the repository DEFAULT branch, which
# is main, so the weekly cadence runs there. `workflow_dispatch` fires from
# any branch the file is on; a push to main touching it also runs it.
on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/exact-gates-weekly.yaml'

name: exact-gates-weekly

permissions: read-all

jobs:
  gates-full:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - name: Bound apt network stalls
        run: |
          echo 'Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/99-ci-retry
          echo 'Acquire::http::Timeout "15";' | sudo tee -a /etc/apt/apt.conf.d/99-ci-retry
          echo 'Acquire::https::Timeout "15";' | sudo tee -a /etc/apt/apt.conf.d/99-ci-retry

      - id: setup_r_1
        continue-on-error: true
        uses: r-lib/actions/setup-r@v2
        timeout-minutes: 12
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Wait before retrying setup-r
        if: steps.setup_r_1.outcome == 'failure'
        shell: bash
        run: sleep 30

      - name: Retry setup-r
        if: steps.setup_r_1.outcome == 'failure'
        uses: r-lib/actions/setup-r@v2
        timeout-minutes: 12
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        timeout-minutes: 15
        with:
          needs: check
          # the independent implementation logistic-reference.R gates against,
          # as in exact-gates.yaml
          extra-packages: any::BART

      - name: Install the package
        run: R CMD INSTALL .

      - name: Run the gates in full mode
        run: |
          # the gate and arm lists exact-gates.yaml's main job loops over
          gates=$(sed -n '/^ *gates="$/,/^ *"$/p' .github/workflows/exact-gates.yaml | grep -v '^ *gates="$' | grep -v '^ *"$' || true)
          arms=$(sed -n '/^ *arms="$/,/^ *"$/p' .github/workflows/exact-gates.yaml | grep -v '^ *arms="$' | grep -v '^ *"$' || true)
          if [ -z "$gates" ] || [ -z "$arms" ]; then
            echo "::error::no gate or arm list found in exact-gates.yaml"
            exit 1
          fi
          fail=0
          for g in $gates; do
            arg=
            # quick in exact-gates.yaml's mode=full too, for the same reason
            if [ "$g" = "bcf-latent-exact.R" ]; then arg=quick; fi
            limit=30m
            if [ "$g" = "logistic-reference.R" ]; then limit=45m; fi
            if [ "$g" = "outer-step-exact.R" ]; then limit=60m; fi
            echo "::group::$g"
            if timeout "$limit" Rscript "benchmarks/R/$g" ${arg}; then
              echo "PASS $g"
            else
              echo "::error::gate $g FAILED (status $?; 124 is the $limit limit)"
              fail=1
            fi
            echo "::endgroup::"
          done
          while read -r g a; do
            if [ -z "$g" ]; then continue; fi
            echo "::group::$g $a"
            # $a unquoted: an arm's arguments are separate words
            if timeout 30m Rscript "benchmarks/R/$g" $a; then
              echo "PASS $g $a"
            else
              echo "::error::gate $g $a FAILED (status $?; 124 is the 30m limit)"
              fail=1
            fi
            echo "::endgroup::"
          done <<< "$arms"
          exit $fail

  monotone-enumeration-full:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        prior: [leaf, joint]

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - name: Bound apt network stalls
        run: |
          echo 'Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/99-ci-retry
          echo 'Acquire::http::Timeout "15";' | sudo tee -a /etc/apt/apt.conf.d/99-ci-retry
          echo 'Acquire::https::Timeout "15";' | sudo tee -a /etc/apt/apt.conf.d/99-ci-retry

      - id: setup_r_1
        continue-on-error: true
        uses: r-lib/actions/setup-r@v2
        timeout-minutes: 12
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Wait before retrying setup-r
        if: steps.setup_r_1.outcome == 'failure'
        shell: bash
        run: sleep 30

      - name: Retry setup-r
        if: steps.setup_r_1.outcome == 'failure'
        uses: r-lib/actions/setup-r@v2
        timeout-minutes: 12
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        timeout-minutes: 15
        with:
          needs: check

      - name: Install the package
        id: install
        run: R CMD INSTALL .

      - name: Run the monotone successive-conditional check
        timeout-minutes: 10
        run: >-
          Rscript benchmarks/R/monotone-successive-conditional.R
          ${{ matrix.prior }} ${{ matrix.prior == 'leaf' && 'twin' || '' }}

      # runs even when the check above fails, so one run surfaces both
      - name: Run the monotone enumeration gate
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 60
        run: >-
          Rscript benchmarks/R/monotone-exact-enumeration.R engine
          ${{ matrix.prior }}

# Simulation-based calibration gate (benchmarks/R/sbc.R): a matrix over the
# families with a recorded SBC verdict -- the gaussian constant-leaf baseline
# plus the probit-k arm (k drawn under its default hyperprior,
# docs/plans/check-shape-fixes.md), the five family tiers
# (docs/plans/sbc-family-tiers.md) and the three
# arms docs/design/aft-status-setter.md carries: aft, and the two
# heteroscedastic ones composing a variance forest with the gaussian and aft
# arms, and the two 20-tree monotone arms, one per prior. Rank uniformity
# is a statistical test that will occasionally false-alarm at its nominal level,
# so this deliberately does NOT gate pull requests: only a scheduled,
# workflow_dispatch-triggered run that turns visibly red on a FLAG.
#
# Admission: sbc.R Bonferroni's the ecdf band's alpha to 0.05/M over the
# matrix's TOTAL functional count (M = 84), so a full matrix passes with
# probability ~0.95 on a fresh stream rather than each arm alarming
# independently at 5%. M sums the eleven Bonferroni'd arms (gaussian, probit-k,
# ordinal, nbinom, t, multinomial, aft, hetero, hetero-aft, monotone-leaf,
# monotone-joint); the matrix runs a twelfth
# job, discrete-selfcheck, which is outside that count. fail-fast is off so one arm's
# FLAG never hides another's.
# A widening M can only turn a recorded FLAG into a PASS, so admitting an arm
# never invalidates a verdict already read.
#
# The seeds are pinned constants (sbcConfig's configSeed, the runners' seed), so
# a healthy matrix replays identically; a draw-shifting commit or a re-rolled
# runner image reshuffles the same fixed-seed stream, which is the other reason
# the gate stays non-blocking.
#
# Timeouts are ~3x the measured single-thread wall-clock on the maintainer's
# laptop, except probit-k's, set below (ordinal 6.6 min, nbinom 8.5 min, t 2.6
# min, multinomial 7.3 min,
# aft 79 s, hetero 2.2 min, hetero-aft 4.4 min at R=200; gaussian 5 min at
# R=100); the monotone arms' are ~3x their GitHub runner job time (leaf 12.6
# min, joint 8.2 min at R=200). nbinom is the
# expensive arm: its Polya-Gamma draw loops sum(y_i + r) times per sweep. aft and the two heteroscedastic arms take the gaussian row's
# 15 minutes rather than their own 3x: under a quarter hour the job's floor is
# the dependency install and the package build, not the arm.
#
# Not in the matrix: BCF, in both its gaussian arms (bcf / bcf-weak), whose
# prognostic cells are a recorded slow-mixing finding rather than a defect
# (sbc-calibration.md A4e; sigma passes at the recorded settings, prog3 and
# prog4 flag, docs/design/bcf.md Calibration), and its two latent ones
# (bcf-probit / bcf-logistic), whose amplitude functionals are measured
# undecorrelated past lag 200 at |a| >= 5, a stratum the prior gives mass 0.126
# (bcf-latent-evidence.md Decision 1, re-measured without the amplitude
# rescaling move) -- a finding on chain length, the R=200 verdicts being
# near-clean.
# And the hazard / hurdle families, which are ill-posed for SBC
# (sbc-family-tiers.md), and the one-tree monotone diagnostics. The
# heteroscedastic pair left that list once the variance forest gained a
# prior-draw entry and a current-state surface accessor (aft-status-setter.md).
#
# NOTE: GitHub binds only `schedule` to the repository DEFAULT branch, so the
# weekly cadence does not start until this workflow lands on main.
# `workflow_dispatch` fires from any branch the file is on
# (`gh workflow run sbc.yaml --ref bartcore`), as does a push touching it; see
# revdep-smoke.yaml and benchmarks/README.md for what to read in the result.
on:
  schedule:
    - cron: '0 3 * * 3'
  workflow_dispatch:
  push:
    branches: [bartcore]
    paths:
      - '.github/workflows/sbc.yaml'

name: sbc

permissions: read-all

jobs:
  sbc:
    runs-on: ubuntu-latest

    name: sbc (${{ matrix.config }})

    timeout-minutes: ${{ matrix.timeout }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # the discrete-rank tie-breaker against a closed-form conjugate
          # posterior: no engine, seconds, and it gates the two grid
          # functionals (nbinom r, Student-t nu) the matrix ranks
          - config: discrete-selfcheck
            reps: 400
            samples: 200
            thin: 30
            timeout: 10
          - config: gaussian
            reps: 100
            samples: 200
            thin: 30
            timeout: 15
          # k drawn under chi(1.5, 2) on probit, the one arm that checks the
          # k step. k and its leaves are a funnel that mixes slowly (ACF 0.1 at
          # lags of 100 to 600 sweeps), so thin 1000; sbc.R gives the arm a
          # 30000-sweep burn. Detection floor: at 600 replications an error of
          # one half in the shape of the k^2 conditional (a missing Jacobian, a
          # leaf too many, the prior's df off by one) is flagged about 80% of
          # the time, and smaller ones pass; k is flagged on its ecdf band or on
          # a chi-square p below the band's alpha. 67 minutes on the laptop
          # (6.7 s a replication), and the runner is 1 to 2 times that: the
          # limit is 180 minutes.
          - config: probit-k
            reps: 600
            samples: 99
            thin: 1000
            timeout: 180
          - config: ordinal
            reps: 200
            samples: 150
            thin: 30
            timeout: 40
          # thin 10 clears the worst ACF-under-0.1 lag the log-mean ladder
          # read, 7 over 24 prior-drawn datasets; no functional is waived
          - config: nbinom
            reps: 200
            samples: 150
            thin: 10
            timeout: 30
          - config: t
            reps: 200
            samples: 150
            thin: 30
            timeout: 20
          - config: multinom
            reps: 200
            samples: 150
            thin: 30
            timeout: 40
          # thin 40 clears the worst ACF-under-0.1 lag the ladder read, 39 over
          # 24 prior-drawn datasets, and the burn the arm resolves from
          # sbcBurnSweeps is 10x its transient. The censored-latent functional
          # ranks only the replications drawing a non-empty censored set and
          # reports its own R beside the others.
          - config: aft
            reps: 200
            samples: 150
            thin: 40
            timeout: 15
          # the two variance-forest arms. Neither ranks sigma - pinned under a
          # variance forest - and both rank the surface in its place: s(x*)
          # off the varianceTest channel square-rooted, and the mean of
          # log s(x) off the train-side one. thin clears the worst
          # ACF-under-0.1 lag each ladder read over 24 prior-drawn datasets,
          # 39 for the gaussian arm and 97 for the aft one, and the burn both
          # resolve from sbcBurnSweeps is 10x the transient they share.
          - config: hetero
            reps: 200
            samples: 150
            thin: 40
            timeout: 15
          - config: hetero-aft
            reps: 200
            samples: 150
            thin: 100
            timeout: 15
          # the two 20-tree monotone arms, one per prior. 12000 burn sweeps
          # (sbcBurnSweeps) and thin 100 clear the ladder's slowest functional
          # (ACF 0.1 at lag ~200 under "leaf", ~140 under "joint").
          - config: monotone-leaf
            reps: 200
            samples: 150
            thin: 100
            timeout: 40
          - config: monotone-joint
            reps: 200
            samples: 150
            thin: 100
            timeout: 25

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      SBC_FAIL_ON_FLAG: 'true'

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check

      - name: Install the package
        run: R CMD INSTALL .

      - name: Run the SBC calibration check
        env:
          SBC_EXPECTED_FLAGS: ${{ matrix.SBC_EXPECTED_FLAGS }}
        run: >
          Rscript benchmarks/R/sbc.R
          ${{ matrix.config }} ${{ matrix.reps }}
          ${{ matrix.samples }} ${{ matrix.thin }}
